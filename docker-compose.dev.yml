version: '3.8'

services:
  tilburg-woo-ui-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: tilburg-woo-ui-dev
    restart: unless-stopped
    volumes:
      # Mount source code for live updates (read-write for constants generation)
      - ./src:/app/src
      - ./public:/app/public:ro
      - ./package.json:/app/package.json:ro
      - ./yarn.lock:/app/yarn.lock:ro
      - ./scripts:/app/scripts:ro
    ports:
      - "81:81"
    environment:
      - NODE_ENV=production
      - BASE_URL=/api/apps
      - GRANT_TYPE=authorization_code
      - CLIENT_ID=
      - CLIENT_SECRET=
      - PROVIDER=nextcloud
      - REGISTER_URL=
      - DIRECTORY_BASE=https://directory.test.commonground.nl
      - NEXTCLOUD_HOST=nextcloud.local
      - NEXTCLOUD_PORT=80
      - NGINX_NEXTCLOUD_UPSTREAM=http://host.docker.internal:80
      - NGINX_NEXTCLOUD_DOMAIN=nextcloud.local
      - NGINX_TARGET_HOST=nextcloud.local
      - NGINX_ROOT_DIR=/app/public_html
      # Site Configuration
      - SITE_TITLE=Environment Config Test ✅
      - SITE_DESCRIPTION=Development instance of the software catalogus
      - SITE=localhost
      - MODE=development
      - THEME_VARIANT=vng
      - ENVIRONMENT_NAME=development
      - SUPPORT_EMAIL_ADDRESS=info@conduction.nl
      # API Configuration (Updated to use cleaner /api instead of /api/index.php/apps)
      
      # Nextcloud/Target Configuration
      - NEXTCLOUD_HOST=nextcloud.local
      
      # Nginx-specific environment variables (for tilburg-woo-ui-dev container)
      - NGINX_NEXTCLOUD_UPSTREAM=http://host.docker.internal:80
      - NGINX_NEXTCLOUD_DOMAIN=nextcloud.local
      - NGINX_TARGET_HOST=nextcloud.local
      - NGINX_ROOT_DIR=/app/public_html
      # Authentication Configuration
      - GRANT_TYPE=authorization_code
      - CLIENT_ID=
      - CLIENT_SECRET=
      - PROVIDER=nextcloud
      - REGISTER_URL=
      # Session Configuration
      - AUTO_LOGOUT=false
      - AUTO_LOGOUT_TIME=3600
      # Monitoring Configuration
      - ROLLBAR_KEY=
      - ROLLBAR_ENVIRONMENT=development
      # Feature Flags
      - ENABLE_AUTHENTICATION=false
      - ENABLE_GEMMA=true
      - ENABLE_DIRECTORY=true
      - ENABLE_ROLLBAR=false
      - ENABLE_MOCK_THEMES=true
      # External URLs
      - EXTERNAL_WEBSITE_URL=https://www.tilburg.nl/
      - EXTERNAL_PRIVACY_URL=https://www.tilburg.nl/privacystatement/
      - EXTERNAL_COOKIES_URL=https://www.tilburg.nl/cookies/
      - EXTERNAL_PROCLAIMER_URL=https://www.tilburg.nl/proclaimer/
      # Visual Configuration
      - HERO_IMAGE_URL=/home-hero-background.png
      # Menu Configuration
      - FOOTER_STYLE=vng
      # Footer Text Configuration
      - FOOTER_LOGO_TITLE=VNG Softwarectalogus
      - FOOTER_LOGO_SUBTITLE=Één plek voor alle software voor en door Gemeenten
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/api/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dev-network

  tilburg-woo-ui-hot:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: hot-reload
    container_name: tilburg-woo-ui-hot
    restart: unless-stopped
    volumes:
      # Mount source code for live updates (read-write for hot reload)
      - ./src:/app/src
      - ./public:/app/public:ro
      - ./package.json:/app/package.json:ro
      - ./yarn.lock:/app/yarn.lock:ro
      - ./scripts:/app/scripts:ro
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - GENERATE_SOURCEMAP=true
      - BROWSER=none
      # Site Configuration
      - SITE_TITLE=Hot Reload Development 🔥
      - SITE_DESCRIPTION=Hot reload development instance
      - SITE=localhost
      - MODE=development
      - THEME_VARIANT=vng
      - ENVIRONMENT_NAME=development
      - SUPPORT_EMAIL_ADDRESS=info@conduction.nl
      # API Configuration (Updated to use cleaner /api instead of /api/index.php/apps)
      - BASE_URL=/api/apps
      - BASE_URL_COMMONGROUND=/api/apps
      
      # Nextcloud/Target Configuration  
      - NEXTCLOUD_HOST=nextcloud.local
      - NEXTCLOUD_PORT=80
      # Nginx Proxy Configuration
      - NGINX_NEXTCLOUD_UPSTREAM=http://host.docker.internal:80
      - NGINX_NEXTCLOUD_DOMAIN=nextcloud.local
      - NGINX_TARGET_HOST=nextcloud.local
      - NGINX_ROOT_DIR=/app/public
      # Authentication Configuration
      - GRANT_TYPE=authorization_code
      - CLIENT_ID=
      - CLIENT_SECRET=
      - PROVIDER=nextcloud
      - REGISTER_URL=
      - DIRECTORY_BASE=https://directory.test.commonground.nl
      # Session Configuration
      - AUTO_LOGOUT=false
      - AUTO_LOGOUT_TIME=3600
      # Monitoring Configuration
      - ROLLBAR_KEY=
      - ROLLBAR_ENVIRONMENT=development
      # Feature Flags
      - ENABLE_AUTHENTICATION=false
      - ENABLE_GEMMA=true
      - ENABLE_DIRECTORY=true
      - ENABLE_ROLLBAR=false
      - ENABLE_MOCK_THEMES=true
      # External URLs
      - EXTERNAL_WEBSITE_URL=https://www.tilburg.nl/
      - EXTERNAL_PRIVACY_URL=https://www.tilburg.nl/privacystatement/
      - EXTERNAL_COOKIES_URL=https://www.tilburg.nl/cookies/
      - EXTERNAL_PROCLAIMER_URL=https://www.tilburg.nl/proclaimer/
      # Visual Configuration
      - HERO_IMAGE_URL=/home-hero-background.png
      # Menu Configuration
      - FOOTER_STYLE=vng
      # Footer Text Configuration
      - FOOTER_LOGO_TITLE=Open Tilburg
      - FOOTER_LOGO_SUBTITLE=Één plek voor alle publicaties van Gemeente Tilburg
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge 
