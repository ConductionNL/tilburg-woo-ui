version: '3.8'

services:
  tilburg-woo-ui-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: tilburg-woo-ui-dev
    restart: unless-stopped
    volumes:
      # Mount source code for live updates (read-write for constants generation)
      - ./src:/app/src
      - ./public:/app/public:ro
      - ./package.json:/app/package.json:ro
      - ./yarn.lock:/app/yarn.lock:ro
      - ./scripts:/app/scripts:ro
    ports:
      - "81:81"
    environment:
      - NODE_ENV=development
      - GENERATE_SOURCEMAP=true
      - BROWSER=none
      - PORT=3000
      # Site Configuration
      - SITE_TITLE=Environment Config Test ✅
      - SITE_DESCRIPTION=Development instance of the software catalogus
      - SITE=localhost
      - MODE=development
      - THEME_VARIANT=development
      - ENVIRONMENT_NAME=development
      # API Configuration (Updated to use /api instead of /api/nextcloud)
      - API_URL=/api/index.php/apps
      - API_URL_COMMONGROUND=/api/index.php/apps
      - API_URL_COMMONGROUND_TOKEN=
      - API_URL_COMMONGROUND_ORGANIZATION_OIN=
      - GEMMA_ENDPOINT=/api
      - OPENCONNECTOR_API_URL=/api/openconnector
      
      # Nextcloud/Target Configuration
      - NEXTCLOUD_HOST=nextcloud.local
      
      # Nginx-specific environment variables (for tilburg-woo-ui-dev container)
      - NGINX_OPENCONNECTOR_UPSTREAM=http://host.docker.internal:80
      - NGINX_NEXTCLOUD_UPSTREAM=http://host.docker.internal:80
      - NGINX_NEXTCLOUD_DOMAIN=nextcloud.local
      - NGINX_TARGET_HOST=nextcloud.local
      # Authentication Configuration
      - GRANT_TYPE=authorization_code
      - CLIENT_ID=
      - CLIENT_SECRET=
      - PROVIDER=nextcloud
      - REGISTER_URL=
      # Session Configuration
      - AUTO_LOGOUT=false
      - AUTO_LOGOUT_TIME=3600
      # Monitoring Configuration
      - ROLLBAR_KEY=
      - ROLLBAR_ENVIRONMENT=development
      # Feature Flags
      - ENABLE_AUTHENTICATION=false
      - ENABLE_GEMMA=true
      - ENABLE_DIRECTORY=true
      - ENABLE_ROLLBAR=false
      - ENABLE_MOCK_THEMES=true
      # External URLs
      - EXTERNAL_WEBSITE_URL=https://www.tilburg.nl/
      - EXTERNAL_PRIVACY_URL=https://www.tilburg.nl/privacystatement/
      - EXTERNAL_COOKIES_URL=https://www.tilburg.nl/cookies/
      - EXTERNAL_PROCLAIMER_URL=https://www.tilburg.nl/proclaimer/
      # Visual Configuration
      - HERO_IMAGE_URL=/home-hero-background.png
      # Menu Configuration
      - MENU_POSITION=2
      - FOOTER_STYLE=vng
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dev-network

  tilburg-woo-ui-hot:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: hot-reload
    container_name: tilburg-woo-ui-hot
    restart: unless-stopped
    volumes:
      # Mount source code for live updates (read-write for hot reload)
      - ./src:/app/src
      - ./public:/app/public:ro
      - ./package.json:/app/package.json:ro
      - ./yarn.lock:/app/yarn.lock:ro
      - ./scripts:/app/scripts:ro
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - GENERATE_SOURCEMAP=true
      - BROWSER=none
      # Site Configuration
      - SITE_TITLE=Hot Reload Development 🔥
      - SITE_DESCRIPTION=Hot reload development instance
      - SITE=localhost
      - MODE=development
      - THEME_VARIANT=development
      - ENVIRONMENT_NAME=development
      # API Configuration (Updated to use /api instead of /api/nextcloud)
      - API_URL=/api/index.php/apps
      - API_URL_COMMONGROUND=/api/index.php/apps
      - API_URL_COMMONGROUND_TOKEN=
      - API_URL_COMMONGROUND_ORGANIZATION_OIN=
      - GEMMA_ENDPOINT=/api
      - OPENCONNECTOR_API_URL=/api/openconnector
      
      # Nextcloud/Target Configuration  
      - NEXTCLOUD_HOST=nextcloud.local
      # Nginx Proxy Configuration
      - NGINX_OPENCONNECTOR_UPSTREAM=http://host.docker.internal:80
      - NGINX_NEXTCLOUD_UPSTREAM=http://host.docker.internal:80
      - NGINX_NEXTCLOUD_DOMAIN=nextcloud.local
      # Authentication Configuration
      - GRANT_TYPE=authorization_code
      - CLIENT_ID=
      - CLIENT_SECRET=
      - PROVIDER=nextcloud
      - REGISTER_URL=
      # Session Configuration
      - AUTO_LOGOUT=false
      - AUTO_LOGOUT_TIME=3600
      # Monitoring Configuration
      - ROLLBAR_KEY=
      - ROLLBAR_ENVIRONMENT=development
      # Feature Flags
      - ENABLE_AUTHENTICATION=false
      - ENABLE_GEMMA=true
      - ENABLE_DIRECTORY=true
      - ENABLE_ROLLBAR=false
      - ENABLE_MOCK_THEMES=true
      # External URLs
      - EXTERNAL_WEBSITE_URL=https://www.tilburg.nl/
      - EXTERNAL_PRIVACY_URL=https://www.tilburg.nl/privacystatement/
      - EXTERNAL_COOKIES_URL=https://www.tilburg.nl/cookies/
      - EXTERNAL_PROCLAIMER_URL=https://www.tilburg.nl/proclaimer/
      # Visual Configuration
      - HERO_IMAGE_URL=/home-hero-background.png
      # Menu Configuration
      - MENU_POSITION=2
      - FOOTER_STYLE=vng
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge 