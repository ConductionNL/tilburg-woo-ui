apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tilburg-woo-ui.fullname" . }}-config
  labels:
    {{- include "tilburg-woo-ui.labels" . | nindent 4 }}
data:
  # Application Configuration
  NODE_ENV: {{ .Values.env.NODE_ENV | quote }}
  BASE_URL: {{ .Values.env.BASE_URL | quote }}
  BASE_URL_COMMONGROUND: {{ .Values.env.BASE_URL_COMMONGROUND | quote }}
  
  # Nginx static file server
  NGINX_ROOT_DIR: {{ .Values.env.NGINX_ROOT_DIR | quote }}
  # No upstream config needed - ingress handles all routing!
  
  {{- if .Values.development.enabled }}
  # Development specific configuration
  FAST_REFRESH: {{ .Values.development.env.FAST_REFRESH | quote }}
  {{- end }}
  
  {{- range $key, $value := .Values.extraEnvVars }}
  {{ $key }}: {{ $value | quote }}
  {{- end }} 