{{- if .Values.ingress.enabled -}}
{{- $fullName := include "tilburg-woo-ui.fullname" . -}}
{{- $svcPort := include "tilburg-woo-ui.servicePort" . -}}
{{- if and .Values.ingress.className (not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class")) }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "tilburg-woo-ui.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if or .Values.global.tls .Values.ingress.tls }}
  tls:
    {{- if .Values.global.tls }}
    {{- $domain := .Values.global.domain }}
    {{- $host := $domain }}
    {{- if .Values.global.subdomain }}
    {{- $host = printf "%s.%s" .Values.global.subdomain $domain }}
    {{- end }}
    - hosts:
        - {{ $host | quote }}
      secretName: {{ printf "%s-tls" (include "tilburg-woo-ui.fullname" .) }}
    {{- end }}
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- $domain := required "global.domain is required! Please provide via ArgoCD parameters." .Values.global.domain }}
    {{- $host := $domain }}
    {{- if .Values.global.subdomain }}
    {{- $host = printf "%s.%s" .Values.global.subdomain $domain }}
    {{- end }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            {{- if and .Values.ingress.pathType (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .Values.ingress.pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $svcPort }}
              {{- end }}
{{- end }} 