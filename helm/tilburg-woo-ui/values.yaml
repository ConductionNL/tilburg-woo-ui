# Default values for tilburg-woo-ui
replicaCount: 1

image:
  repository: ghcr.io/conductionnl/tilburg-woo-ui
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 81

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: tilburg-woo-ui.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: tilburg-woo-ui-tls
  #    hosts:
  #      - tilburg-woo-ui.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables based on docker-compose.yml
env:
  NODE_ENV: "production"
  # API Configuration
  BASE_URL: "/api/apps"
  BASE_URL_COMMONGROUND: "/api/apps"
  # Nginx Proxy Configuration
  NGINX_OPENCONNECTOR_UPSTREAM: "http://host.docker.internal:80"
  NGINX_NEXTCLOUD_UPSTREAM: "http://host.docker.internal:80"
  NGINX_NEXTCLOUD_DOMAIN: "nextcloud.local"
  NGINX_TARGET_HOST: "nextcloud.local"
  NGINX_ROOT_DIR: "/usr/share/nginx/html"

# Health check configuration
healthCheck:
  enabled: true
  path: "/"
  initialDelaySeconds: 40
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

# Development mode configuration
development:
  enabled: false
  image:
    repository: ghcr.io/conductionnl/tilburg-woo-ui
    tag: "dev"
  service:
    port: 3000
    targetPort: 3000
  env:
    NODE_ENV: "development"
    FAST_REFRESH: "true" 