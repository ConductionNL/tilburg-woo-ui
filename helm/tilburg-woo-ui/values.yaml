# Default values for tilburg-woo-ui
#
# =================================
# REQUIRED PARAMETERS FOR ARGOCD
# =================================
# These parameters MUST be provided via ArgoCD Parameters tab:
#
# ALWAYS REQUIRED:
#   ingress.hosts[0].host: "your-domain.com"
#
# REQUIRED FOR PRODUCTION (when env.NODE_ENV=production):
#   resources.limits.cpu: "500m"
#   resources.limits.memory: "512Mi" 
#   resources.requests.cpu: "250m"
#   resources.requests.memory: "256Mi"
#
# OPTIONAL:
#   ingress.tls[0].secretName: "your-tls-secret"
#   image.tag: "specific-version"
# =================================

replicaCount: 1

image:
  repository: ghcr.io/conductionnl/tilburg-woo-ui
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 81

ingress:
  enabled: true  # Standaard aan!
  className: "nginx"  # Default ingress class
  annotations:
    kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    # REQUIRED: Must be provided via ArgoCD parameters!
    # - host: "your-domain.com"
    #   paths:
    #     - path: /
    #       pathType: Prefix
  paths:
    - path: /
      pathType: Prefix
  tls: []
  #  - secretName: tilburg-woo-ui-tls
  #    hosts:
  #      - tilburg-woo-ui.local

resources: {}
  # REQUIRED FOR PRODUCTION: Resources must be specified for production deployments!
  # Set via ArgoCD parameters:
  #   resources.limits.cpu: "500m"
  #   resources.limits.memory: "512Mi"
  #   resources.requests.cpu: "250m" 
  #   resources.requests.memory: "256Mi"
  #
  # Example:
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget for high availability
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  maxUnavailable: 1

nodeSelector: {}

tolerations: []

affinity: {}

# Network Policy Configuration
networkPolicy:
  enabled: false
  ingressNamespace: "ingress-nginx"
  allowSameNamespace: true
  additionalIngressRules: []
  additionalEgressRules: []

# Secrets Configuration
secrets:
  enabled: false
  data: {}
    # Example: API keys, certificates, etc. (base64 encoded)
    # api-key: "your-base64-encoded-secret"
  stringData: {}
    # Example: Plain text secrets
    # database-password: "your-plain-text-password"

# Additional environment variables (not in ConfigMap)
additionalEnvVars: {}

# Extra environment variables for ConfigMap
extraEnvVars: {}

# Environment variables based on docker-compose.yml
env:
  NODE_ENV: "production"
  # API Configuration
  BASE_URL: "/api/apps"
  BASE_URL_COMMONGROUND: "/api/apps"
  # Nginx Proxy Configuration
  NGINX_OPENCONNECTOR_UPSTREAM: "http://host.docker.internal:80"
  NGINX_NEXTCLOUD_UPSTREAM: "http://host.docker.internal:80"
  NGINX_NEXTCLOUD_DOMAIN: "nextcloud.local"
  NGINX_TARGET_HOST: "nextcloud.local"
  NGINX_ROOT_DIR: "/usr/share/nginx/html"

# Health check configuration
healthCheck:
  enabled: true
  path: "/"
  initialDelaySeconds: 40
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1
  # Startup probe for slow-starting containers
  startup:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

# Development mode configuration
development:
  enabled: false
  image:
    repository: ghcr.io/conductionnl/tilburg-woo-ui
    tag: "dev"
  service:
    port: 3000
    targetPort: 3000
  env:
    NODE_ENV: "development"
    FAST_REFRESH: "true" 