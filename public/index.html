<!DOCTYPE html>
<html lang="nl" translate="no">

    <!-- Meta: Tags -->

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=5, width=device-width"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content=""
    />
    
    <!-- Cache Busting: Build Info -->
    <meta name="build-timestamp" content="%BUILD_TIMESTAMP%" />
    <meta name="build-version" content="%BUILD_VERSION%" />

    <link id="favicon" rel="shortcut icon" href="%PUBLIC_URL%/favicon.svg" />

    <!-- Prefetch | Preload -->
    <link rel="dns-prefetch" href="%API_URL%" />
    <link rel="dns-prefetch" href="%STORAGE_URL%" />

    <!-- Meta: Icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/meta/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/meta/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/meta/favicon-16x16.png"
    />
    <link
      rel="manifest"
      href="%PUBLIC_URL%/meta/site.webmanifest"
      crossorigin="use-credentials"
    />
    <link
      rel="mask-icon"
      href="%PUBLIC_URL%/meta/safari-pinned-tab.svg"
      color="#0091c5"
    />
    <link id="faviconMeta" rel="shortcut icon" href="%PUBLIC_URL%/meta/favicon.ico" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta
      name="msapplication-config"
      content="%PUBLIC_URL%/meta/browserconfig.xml"
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- BaseURL -->
    <base href="/" />

    <!-- Title -->
    <title></title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://cdn.fonts.net">
    <link href="https://cdn.fonts.net/kit/98d15e86-0ba4-4c49-97a9-a796340ef3f3/98d15e86-0ba4-4c49-97a9-a796340ef3f3.css"
          rel="stylesheet"/>

    <!-- Runtime Configuration (loaded BEFORE React bundle) -->
    <!-- This file is generated at container startup with environment-specific values -->
    <script src="%PUBLIC_URL%/runtime-config.js"></script>

    <!--
      Municipality theme.

      A deployment activates exactly one theme, chosen at runtime, so only that
      one is loaded. Previously all of them were compiled into the bundle's
      stylesheet and shipped to every visitor.

      This is inlined here rather than imported from the bundle on purpose: the
      variant is only known at runtime, and appending the <link> while the head
      is still parsing lets the browser treat it as render-blocking. Loading it
      later — from the bundle, or after render — would paint the page once with
      default tokens and then again with the municipality's, which reads as a
      flash of the wrong branding.
    -->
    <script>
      (function () {
        var config = window.RUNTIME_CONFIG || {};
        var variant = config.THEME_VARIANT || config.themeVariant || 'vng';

        // Variants with a stylesheet of their own.
        var available = {
          vng: 1,
          migrato: 1,
          venray: 1,
          opencatalogi: 1,
          'horst-aan-de-maas': 1,
        };

        // Variants whose tokens still come from packages inside the bundle.
        // They must not fall back to vng, or they would be restyled.
        var bundled = { tilburg: 1, rotterdam: 1, dimpact: 1 };

        // This mirrors getTheme() in src/App.web.js, which maps 'development'
        // and any unrecognised value to vng-theme. The two must agree: the app
        // sets the class on <body> and this decides which tokens define it, so
        // if they disagree the page gets a theme class with nothing behind it.
        // That is exactly what happened when this only matched exact names —
        // THEME_VARIANT is 'development' in a dev container, so <body> got
        // vng-theme while no vng tokens were ever loaded.
        if (!available[variant]) {
          if (bundled[variant]) {
            return;
          }
          variant = 'vng';
        }

        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '%PUBLIC_URL%/themes/' + variant + '.css';
        document.head.appendChild(link);
      })();
    </script>
  </head>

  <body id="body">
    <!-- Piwik Pro Analytics - MUST BE FIRST SCRIPT IN BODY -->
    <script>
      (function() {
        var srcUrl = '%PIWIK_SRC_URL%';
        var dataLayerName = '%PIWIK_DATA_LAYER%';
        var id = '%PIWIK_ID%';
  
        // if nothing is set, do nothing
        if ([srcUrl, dataLayerName, id].every(v => !v || v.trim() === '')) return;
  
        // if error in the config (with intent to setup Piwik Pro Analytics) throw an error
        if ([srcUrl, dataLayerName, id].some(v => !v || v.trim() === '')) {
          console.error('Piwik Pro Analytics: srcUrl, dataLayerName of id is niet ingesteld');
          return;
        }
        
        (function(window, document, srcUrl, dataLayerName, id) {
        window[dataLayerName]=window[dataLayerName]||[],window[dataLayerName].push({start:(new Date).getTime(),event:"stg.start"});var scripts=document.getElementsByTagName('script')[0],tags=document.createElement('script');
        var qP=[];dataLayerName!=="dataLayer"&&qP.push("data_layer_name="+dataLayerName);var qPString=qP.length>0?("?"+qP.join("&")):"";
        tags.async=!0,tags.src=srcUrl+id+".js"+qPString,scripts.parentNode.insertBefore(tags,scripts);
        !function(a,n,i){a[n]=a[n]||{};for(var c=0;c<i.length;c++)!function(i){a[n][i]=a[n][i]||{},a[n][i].api=a[n][i].api||function(){var a=[].slice.call(arguments,0);"string"==typeof a[0]&&window[dataLayerName].push({event:n+"."+i+":"+a[0],parameters:[].slice.call(arguments,1)})}}(i[c])}(window,"ppms",["tm","cm"]);
        })(window, document, srcUrl, dataLayerName, id);
      })();
    </script>
    <!-- End of Piwik Pro Analytics -->

    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
