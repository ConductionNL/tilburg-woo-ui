version: '3.8'

services:


  tilburg-woo-ui-hot:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: hot-reload
    container_name: tilburg-woo-ui-hot
    restart: unless-stopped
    volumes:
      # Mount source code for live updates (read-write for hot reload)
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json:ro
      - ./yarn.lock:/app/yarn.lock:ro
      - ./scripts:/app/scripts:ro
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - GENERATE_SOURCEMAP=true
      - BROWSER=none
      # Site Configuration
      - SITE_TITLE=Hot Reload Development 🔥
      - SITE_DESCRIPTION=Hot reload development instance
      - SITE=localhost
      - MODE=development
      - THEME_VARIANT=vng
      - ENVIRONMENT_NAME=development
      - SUPPORT_EMAIL_ADDRESS=info@conduction.nl
      # API Configuration (Updated to use localhost:8080)
      - BASE_URL=/api/apps
      - BASE_URL_COMMONGROUND=/api/apps
      - API_TARGET_URL=http://host.docker.internal:8080
      
      # Nextcloud/Target Configuration  
      - NEXTCLOUD_HOST=localhost
      - NEXTCLOUD_PORT=8080
      # Nginx Proxy Configuration
      - NGINX_NEXTCLOUD_UPSTREAM=http://host.docker.internal:8080
      - NGINX_NEXTCLOUD_DOMAIN=localhost
      - NGINX_TARGET_HOST=localhost
      - NGINX_ROOT_DIR=/app/public
      # Authentication Configuration
      - GRANT_TYPE=authorization_code
      - CLIENT_ID=
      - CLIENT_SECRET=
      - PROVIDER=nextcloud
      - REGISTER_URL=
      - DIRECTORY_BASE=https://directory.test.commonground.nl
      # Session Configuration
      - AUTO_LOGOUT=false
      - AUTO_LOGOUT_TIME=3600
      # Monitoring Configuration
      - ROLLBAR_KEY=
      - ROLLBAR_ENVIRONMENT=development
      # Feature Flags
      - ENABLE_AUTHENTICATION=false
      - ENABLE_GEMMA=true
      - ENABLE_DIRECTORY=true
      - ENABLE_ROLLBAR=false
      - ENABLE_MOCK_THEMES=true
      # External URLs
      - EXTERNAL_WEBSITE_URL=https://www.tilburg.nl/
      - EXTERNAL_PRIVACY_URL=https://www.tilburg.nl/privacystatement/
      - EXTERNAL_COOKIES_URL=https://www.tilburg.nl/cookies/
      - EXTERNAL_PROCLAIMER_URL=https://www.tilburg.nl/proclaimer/
      # Visual Configuration
      - HERO_IMAGE_URL=null
      # Menu Configuration
      - FOOTER_STYLE=vng
      # Footer Text Configuration
      - FOOTER_LOGO_TITLE=Open Tilburg
      - FOOTER_LOGO_SUBTITLE=Één plek voor alle publicaties van Gemeente Tilburg
      # Search Configuration
      - DEFAULT_SEARCH_SCHEMA=18
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # Piwik Pro Analytics Configuration
      - PIWIK_SRC_URL=       # url of piwik pro instance (e.g. https://test.piwik.pro/)
      - PIWIK_DATA_LAYER=    # name of the data layer (e.g. dataLayer)
      - PIWIK_ID=            # id of the piwik pro instance (e.g. b67368f0-337b-4b36-b9f2-95cedff6a32b)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge 
