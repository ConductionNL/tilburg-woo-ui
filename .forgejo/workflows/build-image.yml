# Build the Open Tilburg WOO UI container and push to Codeberg's registry.
# Daemonless (kaniko) — Codeberg shared runners have no docker daemon.
name: Build Image

on:
  push:
    branches: [WCAG, softwarecatalogus, development]
    tags: ['v*', 'V*']
  workflow_dispatch: {}

jobs:
  build:
    name: Build & push tilburg-woo-ui
    runs-on: codeberg-medium
    container:
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
    steps:
      - name: kaniko build & push
        shell: sh
        env:
          CB_USER: ${{ secrets.CODEBERG_USERNAME }}
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -e
          mkdir -p /kaniko/.docker
          AUTH=$(printf '%s:%s' "$CB_USER" "$CB_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"codeberg.org":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json
          SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          /kaniko/executor \
            --context "git://codeberg.org/Conduction/tilburg-woo-ui.git#${GITHUB_SHA}" \
            --dockerfile Dockerfile \
            --destination "codeberg.org/conduction/tilburg-woo-ui:latest" \
            --destination "codeberg.org/conduction/tilburg-woo-ui:sha-${SHA}" \
            --verbosity info
